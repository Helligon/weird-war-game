name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Doc checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test the doc scripts
        run: python3 -m unittest discover -s scripts -v
      - name: Check the design vault
        run: python3 scripts/check_docs.py

  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: prototypes/spike-1-hex-map/global.json
      - name: Test the spike 1 simulation core
        working-directory: prototypes/spike-1-hex-map
        run: dotnet test core-tests
